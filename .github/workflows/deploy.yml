name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Generate Playground Examples
        run: |
          python3 scripts/generate_playground_examples.py

      - name: Build Zola Docs
        run: |
          wget -qO- https://github.com/getzola/zola/releases/download/v0.18.0/zola-v0.18.0-x86_64-unknown-linux-gnu.tar.gz | tar xz          
          cd docs.zenc-lang.org && ../zola build

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts


      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install rsync on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "apt-get update && apt-get install -y rsync"

      - name: Pull latest code on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "cd /var/www && git fetch origin main && git reset --hard origin/main"

      - name: Sync files to /var/www/
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" zenc/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/var/www/zenc/          
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" cgit-theme/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/var/www/cgit-theme/
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" docs.zenc-lang.org/public/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/var/www/docs.zenc-lang.org/public/

      - name: Sync and Reload Caddy Configuration
        run: |
          # Sync Caddyfile to the VPS and reload service
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/tmp/Caddyfile
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "sudo mv /tmp/Caddyfile /etc/caddy/Caddyfile && sudo systemctl reload caddy"
          
      - name: Restart Backend Services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "
            # Sync API code
            sudo rsync -av --exclude 'venv' --delete /var/www/playground-api/ /opt/zenc-playground-api/ && 
            cd /opt/zenc-playground-api && 
            
            # Install/Update dependencies in virtualenv
            # Assuming venv is in /opt/zenc-playground-api/venv
            if [ -d 'venv' ]; then
              sudo ./venv/bin/pip install --upgrade pip &&
              sudo ./venv/bin/pip install -r requirements.txt
            fi &&
            
            # Restart service
            sudo systemctl restart playground-api || true && 
            sleep 2 && 
            sudo journalctl -u playground-api -n 20 --no-pager
          "

      - name: Rebuild Docker Sandbox on VPS
        run: |
          # Ensure the sandbox image is fresh during deploy
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "
            cd /var/www/playground-api/sandbox && 
            sudo docker build --build-arg CACHEBUST=$(date +%s) -t zenc_sandbox:latest .
          "

          
      - name: Ensure bare mirror repo exists
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "
            if [ ! -d /var/www/git/Zen-C.git ]; then
              sudo mkdir -p /var/www/git
              sudo git init --bare -b main /var/www/git/Zen-C.git
              cd /var/www/git/Zen-C.git
              git remote add origin https://github.com/zenc-lang/zenc.git
              git fetch origin --prune --tags --force
              sudo chown -R $USER:www-data /var/www/git/Zen-C.git
              sudo chmod -R g+rX /var/www/git/Zen-C.git
            fi
            git config --system --add safe.directory /var/www/git/Zen-C.git || true
          "

      - name: Sync and Link Mirror Infrastructure
        run: |
          # Sync mirror metadata and scripts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" mirror/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/var/www/mirror/
          
          # Link the repository-specific cgitrc to the bare repo
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "ln -sf /var/www/mirror/configs/Zen-C.cgitrc /var/www/git/Zen-C.git/cgitrc"
          
          # Update the git description file in the bare repo (to fix the 'Unnamed repository' text)
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "echo 'Official Zen C source code mirror (self-hosted)' > /var/www/git/Zen-C.git/description"

          # Ensure scripts are executable
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "chmod +x /var/www/mirror/scripts/*.sh"

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
